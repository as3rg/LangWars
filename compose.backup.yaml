# Optional PostgreSQL 17 physical full/incremental backups. See docs/Backups.md.
# BACKUP_DIR must be an absolute path on the Docker host, outside this checkout.
services:
  db:
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=80, -c, summarize_wal=on, -c, wal_summary_keep_time=14d]
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR to an absolute backup directory on the Docker host}
        target: /backups
        bind:
          create_host_path: false
