name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: langwars
          POSTGRES_PASSWORD: integration-tests-only
          POSTGRES_DB: langwars_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U langwars -d langwars_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://langwars:integration-tests-only@127.0.0.1:5432/langwars_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-configuration-validation-only
          BOOTSTRAP_ADMIN_PASSWORD: ci-configuration-validation-only
      - run: docker compose -f compose.yaml -f compose.public.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-configuration-validation-only
          BOOTSTRAP_ADMIN_PASSWORD: ci-configuration-validation-only
          PUBLIC_DOMAIN: langwars.example.org
