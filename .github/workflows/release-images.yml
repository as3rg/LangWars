name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read

# A rerun of one release cannot race itself; different releases keep their own builds.
concurrency:
  group: release-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: Dockerfile
          - component: web
            dockerfile: frontend/Dockerfile
          - component: ingress
            dockerfile: deploy/Caddy.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Select image name
        id: image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$RELEASE_TAG" == latest || "$RELEASE_TAG" == sha-* ]]; then
            echo '::error::Use a Docker-compatible release tag; latest and sha-* are reserved.'
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          {
            printf '### %s\n\n' "$IMAGE"
            # Markdown fences are literal, not shell command substitutions.
            # shellcheck disable=SC2016
            printf '```text\n%s\n%s@%s\n```\n' "$TAGS" "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  latest:
    name: Promote complete stable release
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-images-latest
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only GitHub's current latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          latest_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .id)"
          if [ "$latest_id" != "$RELEASE_ID" ]; then
            echo 'This is not the current latest release; version tags remain available.'
            exit 0
          fi
          for component in server web ingress; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-${component}"
            docker buildx imagetools create --tag "${image}:latest" "${image}:${RELEASE_TAG}"
          done
