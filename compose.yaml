name: langwars

x-server: &server
  image: langwars-server:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777,noexec,nosuid
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  networks: [arena]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: langwars
      POSTGRES_USER: langwars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=80]
    volumes:
      - postgres:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U langwars -d langwars"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [arena]

  api:
    <<: *server
    environment:
      DATABASE_URL: postgresql://langwars:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/langwars
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost.invalid}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
    mem_limit: 384m
    cpus: 1.0
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *server
    command: [python, -m, server.worker]
    environment:
      DATABASE_URL: postgresql://langwars:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/langwars
      WORKER_MEMORY_MB: ${WORKER_MEMORY_MB:-256}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-20}
    mem_limit: 384m
    cpus: 1.0
    depends_on:
      api: {condition: service_healthy}

  web:
    image: langwars-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    depends_on:
      api: {condition: service_healthy}
    networks: [arena]

volumes:
  postgres:

networks:
  arena:
